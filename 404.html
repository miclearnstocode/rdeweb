<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 6rem;
            margin: 0;
            color: #ff6b6b;
        }
        h2 {
            font-size: 2rem;
            margin: 20px 0;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        a {
            display: inline-block;
            padding: 12px 30px;
            background: #4ecdc4;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.1rem;
            transition: background 0.3s;
        }
        a:hover {
            background: #3db8af;
        }
        .error-code {
            font-family: monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin: 20px 0;
            font-size: 0.9rem;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for might have been removed,<br>had its name changed, or is temporarily unavailable.</p>
        
        <div class="error-code">
            Requested URL: <span id="url"></span>
        </div>
        
        <a href="/">Go to Homepage</a>
        <a href="/account/Login" style="margin-left: 15px; background: #667eea;">Go to Login</a>
    </div>

    <script>
        // Show the requested URL
        document.getElementById('url').textContent = window.location.pathname;
        
        // Auto-redirect to login after 10 seconds if on API route
        if (window.location.pathname.includes('/sessionCheck') || 
            window.location.pathname.includes('/loginAuth')) {
            setTimeout(() => {
                window.location.href = '/account/Login';
            }, 10000);
        }
    </script>
</body>
</html>
