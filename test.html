<!DOCTYPE html>
<html>
<head>
    <title>Test Resubmit API</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a2634; color: #bbb; }
        button { padding: 10px; margin: 5px; background: deepskyblue; color: white; border: none; border-radius: 4px; cursor: pointer; }
        pre { background: #2c3e50; padding: 10px; border-radius: 4px; overflow: auto; }
        input { padding: 8px; width: 300px; margin: 10px 0; background: #2c3e50; color: #bbb; border: 1px solid #555; border-radius: 4px; }
        .result { margin-top: 20px; }
        .success { color: #4caf50; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>
    <h1>Test Resubmit API</h1>
    
    <div>
        <h3>Test 1: Get All Rejected Documents for Current User</h3>
        <button onclick="testGetAllRejected()">Get All Rejected Documents</button>
    </div>
    
    <div>
        <h3>Test 2: Get Specific Document by ID</h3>
        <input type="text" id="docId" placeholder="Enter Document ID" value="514">
        <button onclick="testGetSpecificDoc()">Get Document by ID</button>
    </div>
    
    <div>
        <h3>Test 3: Check Database Status Values</h3>
        <button onclick="testCheckStatusValues()">Check Status Values in DB</button>
    </div>
    
    <div class="result" id="result"></div>

    <script>
        async function testGetAllRejected() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="success">Loading...</div>';
            
            try {
                const formData = new FormData();
                formData.append('getRejectedForResubmit', 'true');
                
                const response = await fetch('/getresearch', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h4>Response:</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <h4>Status: ${data.status ? '✅ Success' : '❌ Failed'}</h4>
                    <h4>Message: ${data.message}</h4>
                    <h4>Data Length: ${data.data ? data.data.length : 0}</h4>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function testGetSpecificDoc() {
            const docId = document.getElementById('docId').value;
            if (!docId) {
                alert('Please enter a document ID');
                return;
            }
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="success">Loading...</div>';
            
            try {
                const formData = new FormData();
                formData.append('getRejectedForResubmit', 'true');
                formData.append('docId', docId);
                
                const response = await fetch('/getresearch', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h4>Response:</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <h4>Status: ${data.status ? '✅ Success' : '❌ Failed'}</h4>
                    <h4>Message: ${data.message}</h4>
                    <h4>Data Length: ${data.data ? data.data.length : 0}</h4>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function testCheckStatusValues() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="success">Checking status values in database...</div>';
            
            try {
                // This is a diagnostic query to see what status values exist
                const formData = new FormData();
                formData.append('checkStatusValues', 'true');
                
                const response = await fetch('/getresearch', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h4>Status Values in Database:</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        // Also add a test to check the specific document from your data
        async function testSpecificDocFromData() {
            // From your data, the document ID is 514
            const docId = '514';
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="success">Testing document ID 514...</div>';
            
            try {
                const formData = new FormData();
                formData.append('getRejectedForResubmit', 'true');
                formData.append('docId', docId);
                
                const response = await fetch('/getresearch', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h4>Response for Document ID ${docId}:</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        // Add button for this test
        document.addEventListener('DOMContentLoaded', () => {
            const div = document.querySelector('div:last-child');
            const button = document.createElement('button');
            button.textContent = 'Test Document ID 514';
            button.onclick = testSpecificDocFromData;
            div.appendChild(button);
        });
    </script>
</body>
</html>
